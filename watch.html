
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonton Video - VideoKu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 65px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid #292929;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      color: white;
    }

    .logo span {
      color: #ff3030;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
      gap: 24px;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 12px;
    }

    h1 {
      font-size: 22px;
      margin: 18px 0 12px;
    }

    .description {
      background: #222;
      padding: 16px;
      border-radius: 12px;
      color: #ddd;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .recommendation {
      background: #202020;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .recommendation h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .recommendation p {
      margin: 0;
      font-size: 13px;
      color: #aaa;
    }

    @media (max-width: 750px) {
      main {
        display: block;
        padding: 0 12px;
        margin-top: 15px;
      }

      .recommendations {
        margin-top: 30px;
      }

      h1 {
        font-size: 19px;
      }

      video {
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="./">
      <span>▶</span> VideoKu
    </a>

    <a class="back" href="./">← Kembali ke beranda</a>
  </header>

  <main>
    <section>
      <video id="player" controls playsinline preload="metadata">
        Browser kamu tidak mendukung pemutar video HTML5.
      </video>

      <h1 id="videoTitle">Memuat video...</h1>

      <div class="description" id="videoDescription">
        Sedang memuat informasi video.
      </div>
    </section>

    <aside class="recommendations">
      <h3>Video lainnya</h3>

      <div class="recommendation">
        <h3>VideoKu</h3>
        <p>Video lainnya akan ditampilkan di sini.</p>
      </div>
    </aside>
  </main>

  <script>
    // Contoh data sementara.
    // Nanti akan kita hubungkan ke data/videos.json.
    const sampleVideos = {
      "1": {
        title: "Contoh Video Pertama",
        description: "Selamat datang di VideoKu!",
        url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      },
      "2": {
        title: "Contoh Video Kedua",
        description: "Ini adalah contoh video kedua.",
        url: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const video = sampleVideos[id];

    if (video) {
      document.title = video.title + " - VideoKu";
      document.getElementById("videoTitle").textContent = video.title;
      document.getElementById("videoDescription").textContent =
        video.description;

      document.getElementById("player").src = video.url;
    } else {
      document.getElementById("videoTitle").textContent =
        "Video belum ditemukan";

      document.getElementById("videoDescription").textContent =
        "ID video tidak tersedia. Silakan kembali ke beranda.";
    }
  </script>
</body>
</html>
