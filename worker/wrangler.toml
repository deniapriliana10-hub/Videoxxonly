name = "videoku-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Atur value ini sesuai URL GitHub Pages milikmu, tanpa slash di akhir.
# Contoh: https://username.github.io atau https://username.github.io/nama-repo
[vars]
SITE_ORIGIN = "https://USERNAME.github.io"
GITHUB_OWNER = "USERNAME"
GITHUB_REPO = "videoku"
GITHUB_BRANCH = "main"

# Tambahkan secrets melalui `npx wrangler secret put GITHUB_TOKEN`,
# `npx wrangler secret put ADMIN_PASSWORD`, dan `npx wrangler secret put JWT_SECRET`.
# Jangan masukkan nilai rahasia ke file ini.
