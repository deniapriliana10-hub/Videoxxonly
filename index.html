  <!-- Diagnosis jika app.js tidak berhasil berjalan -->
  <script>
    (() => {
      const grid = document.getElementById("videoGrid");
      if (!grid) return;

      let appStarted = false;

      // app.js dapat memberi tanda ketika berhasil dijalankan.
      window.addEventListener("videoku-app-started", () => {
        appStarted = true;
      });

      // Jika app.js tidak berjalan, tampilkan penyebab yang bisa diperiksa.
      window.setTimeout(() => {
        if (appStarted) return;

        if (grid.querySelector(".video-card")) return;

        grid.innerHTML = `
          <div class="diagnostic-state">
            <p>Aplikasi video belum berhasil dijalankan.</p>
            <p>Periksa file assets/app.js dan assets/config.js.</p>
            <button type="button" id="diagnosticRetry">
              Coba muat ulang
            </button>
          </div>
        `;

        document.getElementById("diagnosticRetry")
          ?.addEventListener("click", () => {
            window.location.reload();
          });
      }, 10000);
    })();
  </script>
