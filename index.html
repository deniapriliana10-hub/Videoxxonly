
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoKu - Tonton Video</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      background: #0f0f0f;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #272727;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      white-space: nowrap;
    }

    .logo span {
      color: #ff3030;
    }

    .search {
      margin: auto;
      width: 45%;
      max-width: 500px;
    }

    .search input {
      width: 100%;
      padding: 12px 16px;
      background: #222;
      border: 1px solid #444;
      border-radius: 25px;
      color: white;
      outline: none;
    }

    main {
      padding: 24px;
    }

    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .category {
      background: #272727;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 14px;
    }

    .category.active {
      background: white;
      color: black;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px 16px;
    }

    .video-card {
      min-width: 0;
      cursor: pointer;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #272727;
      border-radius: 12px;
      object-fit: cover;
      display: block;
    }

    .video-title {
      font-size: 16px;
      font-weight: bold;
      margin: 12px 0 7px;
    }

    .video-info {
      color: #aaa;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .videos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      header {
        padding: 0 12px;
      }

      .logo {
        font-size: 20px;
      }

      .search {
        width: auto;
        flex: 1;
      }

      main {
        padding: 14px 10px;
      }

      .videos {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo"><span>▶</span> VideoKu</div>

    <div class="search">
      <input
        type="search"
        id="searchInput"
        placeholder="Cari video..."
      >
    </div>
  </header>

  <main>
    <div class="categories">
      <div class="category active">Semua</div>
      <div class="category">Terbaru</div>
      <div class="category">Populer</div>
    </div>

    <div class="videos" id="videoList">
      <div class="video-card">
        <img
          class="thumbnail"
          src="https://placehold.co/640x360/272727/ffffff?text=Video+1"
          alt="Thumbnail video pertama"
        >
        <div class="video-title">Selamat datang di VideoKu</div>
        <div class="video-info">VideoKu · Contoh video</div>
      </div>

      <div class="video-card">
        <img
          class="thumbnail"
          src="https://placehold.co/640x360/303030/ffffff?text=Video+2"
          alt="Thumbnail video kedua"
        >
        <div class="video-title">Video kedua</div>
        <div class="video-info">VideoKu · Contoh video</div>
      </div>

      <div class="video-card">
        <img
          class="thumbnail"
          src="https://placehold.co/640x360/383838/ffffff?text=Video+3"
          alt="Thumbnail video ketiga"
        >
        <div class="video-title">Video ketiga</div>
        <div class="video-info">VideoKu · Contoh video</div>
      </div>
    </div>
  </main>

  <script>
    const searchInput = document.getElementById("searchInput");
    const videoCards = document.querySelectorAll(".video-card");

    searchInput.addEventListener("input", function () {
      const keyword = this.value.toLowerCase();

      videoCards.forEach(function (card) {
        const title = card
          .querySelector(".video-title")
          .textContent.toLowerCase();

        card.style.display = title.includes(keyword)
          ? ""
          : "none";
      });
    });
  </script>

</body>
</html>
